<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>כניסה למפרעות • EMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(700px 420px at 80% 0%,rgba(22,163,74,.16),transparent 58%),#f6f8fb}
    .payLogin{width:min(440px,100%);padding:22px;border-radius:28px;background:#fff;border:1px solid #e2e8f0;box-shadow:0 28px 80px rgba(15,23,42,.14)}
    .payLogo{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,#16a34a,#059669);color:#fff;font-size:28px;box-shadow:0 16px 34px rgba(22,163,74,.24);margin-bottom:14px}
    .payLogin h1{margin:0;font-size:27px}.payLogin p{color:#64748b;font-weight:700;margin:7px 0 20px}
    .pin{font-size:24px!important;text-align:center;direction:ltr;letter-spacing:5px;font-weight:900}
    .msgBox{margin-top:12px;padding:11px 13px;border-radius:14px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-weight:900;display:none}
    .foot{margin-top:16px;text-align:center;color:#94a3b8;font-size:12px;font-weight:700}
  </style>
</head>
<body>
  <div class="payLogin">
    <div class="payLogo">₪</div>
    <h1>כניסה למפרעות</h1>
    <p>כניסה אישית לנור, גנאיים ופאדי. המערכת מזהה אוטומטית מי רושם את המפרעה.</p>

    <label for="pin">הסיסמה האישית שלך</label>
    <input id="pin" class="input pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" />
    <div style="height:12px"></div>
    <button id="loginBtn" class="btn primary" style="width:100%" type="button">כניסה</button>
    <div id="msg" class="msgBox"></div>
    <div class="foot">EMS • אזור מפרעות מאובטח</div>
  </div>

<script type="module">
  import { FN_PAYMENTS_API, savePaymentsSession, getPaymentsToken } from './js/payments-auth.js';

  if (getPaymentsToken()) location.href = 'payments-portal.html';

  const pin = document.getElementById('pin');
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');

  function show(text){ msg.textContent=text; msg.style.display='block'; }
  async function login(){
    const value = pin.value.trim();
    if (!/^\d{4,12}$/.test(value)) return show('הזן סיסמה מספרית תקינה');
    msg.style.display='none'; btn.disabled=true; btn.textContent='נכנס…';
    try{
      const res = await fetch(`${FN_PAYMENTS_API}/login`, {
        method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({pin:value})
      });
      const data = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(data?.error || 'כניסה נכשלה');
      savePaymentsSession(data.token, data.payer, data.display_name);
      location.href='payments-portal.html';
    }catch(e){ show(e.message || 'שגיאה בכניסה'); }
    finally{ btn.disabled=false; btn.textContent='כניסה'; }
  }
  btn.addEventListener('click', login);
  pin.addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
  setTimeout(()=>pin.focus(),100);
</script>
</body>
</html>
